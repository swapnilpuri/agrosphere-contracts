  "info": {
    "title": "ANL-02 isolated Analytics candidate",
    "version": "0.1.0",
    "description": "UNRELEASED candidate. SIMULATED-only observed production history; no stream-completeness, forecast or yield claim. UNRELEASED environmental history extension; explicit UTC windows, observed evidence only."
  },
  "paths": {
    "/api/v1/analytics/estates/{estateId}/blocks/{blockId}/production/daily": {
      "get": {
        "operationId": "getDailyProductionHistory",
        "parameters": [
          {
            "name": "estateId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
