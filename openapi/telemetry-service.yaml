  "paths": {
    "/api/v1/telemetry/estates/{estateId}/blocks/{blockId}/latest": {
      "parameters": [
        {
          "name": "estateId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          }
        },
        {
          "name": "blockId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          }
        }
      ],
      "get": {
        "operationId": "getLatestTelemetryReadings",
        "description": "Issuer/audience and trusted estate_ids validated independently at Gateway/service. Reuse Estate read roles: PLATFORM_ADMIN/PLANTATION_ADMIN with explicit target estate; ESTATE_ADMIN/ESTATE_MANAGER/VIEWER/FIELD_SUPERVISOR/FIELD_WORKER/AUDITOR require trusted estate_ids. Deny before query. Unknown/inactive authoritative block: 404; dependency unavailable: 503. An authorized active block without readings returns 200, NONE and empty readings. At most one reading per kind, sorted by kind; latest uses observedAt then lowercase UUID lexical order. Coverage denotes kind presence, not freshness, calibration or accuracy.",
        "responses": {
          "200": {
            "description": "Latest per measurement kind",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LatestReadings"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "Rate limited",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    }
  },
